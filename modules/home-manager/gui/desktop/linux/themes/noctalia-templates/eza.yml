# eza 主题模板 —— 由 Noctalia 渲染
# 注册处：modules/home-manager/gui/wm/noctalia.nix 的 theme.templates.user.eza
# 占位符 colors.terminal_* 取自当前 Noctalia 调色板的 terminal 16 色，
# 与 ghostty / btop / yazi 同源，故目录列表的配色和终端一致。
# eza 的 color_from_str 只认带 "#" 的 6/3 位十六进制，裸十六进制会被静默丢弃
# （回落成 None），故一律用 hex（带 #）。
filekinds:
  normal: { foreground: "{{ colors.terminal_foreground.default.hex }}" }
  directory: { foreground: "{{ colors.terminal_normal_blue.default.hex }}" }
  symlink: { foreground: "{{ colors.terminal_normal_cyan.default.hex }}" }
  pipe: { foreground: "{{ colors.terminal_bright_black.default.hex }}" }
  block_device: { foreground: "{{ colors.terminal_normal_yellow.default.hex }}" }
  char_device: { foreground: "{{ colors.terminal_normal_yellow.default.hex }}" }
  socket: { foreground: "{{ colors.terminal_normal_magenta.default.hex }}" }
  special: { foreground: "{{ colors.terminal_normal_yellow.default.hex }}" }
  executable: { foreground: "{{ colors.terminal_normal_green.default.hex }}" }
  mount_point: { foreground: "{{ colors.terminal_normal_magenta.default.hex }}" }

perms:
  user_read: { foreground: "{{ colors.terminal_normal_yellow.default.hex }}" }
  user_write: { foreground: "{{ colors.terminal_normal_red.default.hex }}" }
  user_execute_file: { foreground: "{{ colors.terminal_normal_green.default.hex }}" }
  user_execute_other: { foreground: "{{ colors.terminal_normal_green.default.hex }}" }
  group_read: { foreground: "{{ colors.terminal_normal_yellow.default.hex }}" }
  group_write: { foreground: "{{ colors.terminal_normal_red.default.hex }}" }
  group_execute: { foreground: "{{ colors.terminal_normal_green.default.hex }}" }
  other_read: { foreground: "{{ colors.terminal_normal_yellow.default.hex }}" }
  other_write: { foreground: "{{ colors.terminal_normal_red.default.hex }}" }
  other_execute: { foreground: "{{ colors.terminal_normal_green.default.hex }}" }
  special_user_file: { foreground: "{{ colors.terminal_normal_magenta.default.hex }}" }
  special_other: { foreground: "{{ colors.terminal_normal_magenta.default.hex }}" }
  attribute: { foreground: "{{ colors.terminal_bright_black.default.hex }}" }

size:
  major: { foreground: "{{ colors.terminal_normal_green.default.hex }}" }
  minor: { foreground: "{{ colors.terminal_normal_green.default.hex }}" }
  number_byte: { foreground: "{{ colors.terminal_normal_blue.default.hex }}" }
  number_kilo: { foreground: "{{ colors.terminal_normal_blue.default.hex }}" }
  number_mega: { foreground: "{{ colors.terminal_normal_blue.default.hex }}" }
  number_giga: { foreground: "{{ colors.terminal_normal_blue.default.hex }}" }
  number_huge: { foreground: "{{ colors.terminal_normal_blue.default.hex }}" }
  unit_byte: { foreground: "{{ colors.terminal_normal_cyan.default.hex }}" }
  unit_kilo: { foreground: "{{ colors.terminal_normal_cyan.default.hex }}" }
  unit_mega: { foreground: "{{ colors.terminal_normal_cyan.default.hex }}" }
  unit_giga: { foreground: "{{ colors.terminal_normal_cyan.default.hex }}" }
  unit_huge: { foreground: "{{ colors.terminal_normal_cyan.default.hex }}" }

users:
  user_you: { foreground: "{{ colors.terminal_normal_white.default.hex }}" }
  user_root: { foreground: "{{ colors.terminal_normal_red.default.hex }}" }
  user_other: { foreground: "{{ colors.terminal_normal_yellow.default.hex }}" }
  group_yours: { foreground: "{{ colors.terminal_normal_white.default.hex }}" }
  group_other: { foreground: "{{ colors.terminal_normal_yellow.default.hex }}" }
  group_root: { foreground: "{{ colors.terminal_normal_red.default.hex }}" }

links:
  normal: { foreground: "{{ colors.terminal_normal_cyan.default.hex }}" }
  multi_link_file: { foreground: "{{ colors.terminal_normal_cyan.default.hex }}" }

git:
  new: { foreground: "{{ colors.terminal_normal_green.default.hex }}" }
  modified: { foreground: "{{ colors.terminal_normal_yellow.default.hex }}" }
  deleted: { foreground: "{{ colors.terminal_normal_red.default.hex }}" }
  renamed: { foreground: "{{ colors.terminal_normal_cyan.default.hex }}" }
  typechange: { foreground: "{{ colors.terminal_normal_magenta.default.hex }}" }
  ignored: { foreground: "{{ colors.terminal_bright_black.default.hex }}" }
  conflicted: { foreground: "{{ colors.terminal_normal_red.default.hex }}" }

git_repo:
  branch_main: { foreground: "{{ colors.terminal_normal_white.default.hex }}" }
  branch_other: { foreground: "{{ colors.terminal_normal_magenta.default.hex }}" }
  git_clean: { foreground: "{{ colors.terminal_normal_green.default.hex }}" }
  git_dirty: { foreground: "{{ colors.terminal_normal_red.default.hex }}" }

punctuation: { foreground: "{{ colors.terminal_bright_black.default.hex }}" }
date: { foreground: "{{ colors.terminal_normal_blue.default.hex }}" }
inode: { foreground: "{{ colors.terminal_normal_magenta.default.hex }}" }
blocks: { foreground: "{{ colors.terminal_normal_cyan.default.hex }}" }
header: { foreground: "{{ colors.terminal_normal_white.default.hex }}" }
octal: { foreground: "{{ colors.terminal_normal_magenta.default.hex }}" }
flags: { foreground: "{{ colors.terminal_normal_magenta.default.hex }}" }
