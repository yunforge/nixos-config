# Playback
# 播放结束后保持窗口
keep-open=yes
# 播放结束后显示最后一帧
keep-open-pause=yes
# 窗口不跟随视频宽高比
# mpv 默认 yes：把窗口撑成视频比例。niri 会照单全收（列高由客户端定），
# 竖屏视频实测被撑到 1268×2255，屏幕只有 1440 高 —— 看起来就是「放大到满屏」。
# 关掉后窗口保持 niri 给的尺寸，视频在窗口内按原始比例留黑边。
keepaspect-window=no


# Hardware acceleration
# 使用 GPU 渲染
vo=gpu-next
# Vulkan 后端
gpu-api=vulkan
# NVIDIA 硬件解码
hwdec=nvdec


# Video quality
# 高质量缩放
scale=ewa_lanczos
cscale=ewa_lanczos


# Sync
# 适合笔记本屏幕
video-sync=display-resample


# UI
# 启动时默认不显示 OSC
osc=no
# 默认音量
volume=70


# Screenshot
screenshot-format=png
screenshot-directory=~/Pictures/mpv

# Custom uosc titlebar
border=no

# Use custom feedback; hide mpv built-in status text and progress bars.
osd-level=0
osd-bar=no
